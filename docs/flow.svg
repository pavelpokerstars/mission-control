<svg viewBox="0 0 880 640" width="880" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcTitle mcDesc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="mcTitle">Mission Control information flow</title>
  <desc id="mcDesc">Zoom transcripts and Slack conversation feed the Mission Control gateway, which holds the event log. The gateway proposes changes to Jira behind a human approval gate. Jira and Miro stay in two-way sync via app cards. Jira records decisions into Confluence. Solid arrows are automatic; dashed arrows require a human to approve.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6a65"/></marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c15f3c"/></marker>
    <marker id="ahS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c15f3c" fill-opacity="0.85"/></marker>
  </defs>
  <style>
    .box{fill:#faf9f5;stroke:#d9d7d0;stroke-width:1.25}
    .spine{fill:#faf9f5;stroke:#c15f3c;stroke-width:1.75}
    .hub{fill:#f0eee7;stroke:#d9d7d0;stroke-width:1.25}
    .t{fill:#141413;font-size:14px;font-weight:600}
    .s{fill:#6b6a65;font-size:11px}
    .lbl{fill:#6b6a65;font-size:10.5px}
    .lblA{fill:#c15f3c;font-size:10.5px;font-weight:600}
    .ln{stroke:#6b6a65;stroke-width:1.4;fill:none}
    .lnA{stroke:#c15f3c;stroke-width:1.8;fill:none}
    .gate{stroke:#c15f3c;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
    .tag{fill:#8f8d86;font-size:9.5px}
  </style>
  <rect x="0" y="0" width="880" height="640" fill="#ffffff"/>
  <rect class="box" x="70" y="28" width="200" height="62" rx="9"/>
  <text class="t" x="88" y="54">Zoom</text>
  <text class="s" x="88" y="72">the input · transcripts</text>
  <rect class="box" x="610" y="28" width="200" height="62" rx="9"/>
  <text class="t" x="628" y="54">Slack</text>
  <text class="s" x="628" y="72">the nervous system</text>
  <rect class="hub" x="70" y="152" width="740" height="84" rx="10"/>
  <text class="t" x="94" y="184">Mission Control gateway</text>
  <text class="s" x="94" y="204">one event log · field ownership · echo suppression · Copilot + the graph</text>
  <text class="tag" x="94" y="222">nothing calls anything directly — everything reacts to the log</text>
  <rect class="spine" x="100" y="312" width="220" height="80" rx="9"/>
  <text class="t" x="122" y="342">Jira</text>
  <text class="s" x="122" y="360">the database</text>
  <text class="tag" x="122" y="377">status · assignee · sprint</text>
  <rect class="spine" x="560" y="312" width="220" height="80" rx="9"/>
  <text class="t" x="582" y="342">Miro</text>
  <text class="s" x="582" y="360">the view</text>
  <text class="tag" x="582" y="377">position · frames · arrows</text>
  <text class="tag" x="582" y="303" font-weight="600" fill="#c15f3c">the only real iframe</text>
  <rect class="box" x="100" y="480" width="220" height="72" rx="9"/>
  <text class="t" x="122" y="510">Confluence</text>
  <text class="s" x="122" y="528">the memory · decision records</text>
  <path class="ln" d="M 170 90 L 170 148" marker-end="url(#ah)"/>
  <text class="lbl" x="180" y="122">evidence, never authority</text>
  <path class="ln" d="M 690 148 L 690 92" marker-end="url(#ah)"/>
  <text class="lbl" x="700" y="124">notify</text>
  <path class="ln" d="M 640 92 L 640 148" marker-end="url(#ah)"/>
  <text class="lbl" x="512" y="124" text-anchor="end">context, commands</text>
  <path class="gate" d="M 190 236 L 190 308" marker-end="url(#ahA)"/>
  <text class="lblA" x="202" y="264">proposals</text>
  <text class="tag" x="202" y="280">a human presses accept</text>
  <path class="ln" d="M 690 308 L 690 240" marker-end="url(#ah)"/>
  <text class="lbl" x="678" y="272" text-anchor="end">arrows drawn = dependencies</text>
  <path class="lnA" d="M 326 352 L 554 352" marker-end="url(#ahA)" marker-start="url(#ahS)"/>
  <text class="lblA" x="440" y="340" text-anchor="middle">app cards · two-way</text>
  <text class="tag" x="440" y="372" text-anchor="middle">joined by the Jira key</text>
  <path class="gate" d="M 190 396 L 190 476" marker-end="url(#ahA)"/>
  <text class="lblA" x="202" y="426">records</text>
  <text class="tag" x="202" y="442">decisions, once accepted</text>
  <line class="ln" x1="470" y1="500" x2="510" y2="500" marker-end="url(#ah)"/>
  <text class="lbl" x="520" y="504">automatic mirroring</text>
  <line class="gate" x1="470" y1="526" x2="510" y2="526" marker-end="url(#ahA)"/>
  <text class="lbl" x="520" y="530">requires human approval</text>
  <text class="tag" x="470" y="556">Mirroring is automatic. Creating work never is.</text>
  <line x1="70" y1="592" x2="810" y2="592" stroke="#d9d7d0" stroke-width="1"/>
  <text class="tag" x="70" y="614">Exactly one surface may write each field. Everything else is a proposal.</text>
</svg>
